name: Deploy site

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833207323750:role/site-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: >
          aws s3 sync . s3://static-website-hosting-tobyjones
          --delete
          --exclude ".git/*"
          --exclude ".github/*"
          --exclude "README.md"